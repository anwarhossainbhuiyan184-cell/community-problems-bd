    <path d="M-260 650C180 510 560 350 900 200C1140 95 1350 10 1660 -75" stroke="#D6283E" stroke-width="112" opacity="0.97"/>
    <path d="M-260 505C180 365 560 210 900 65C1140 -40 1350 -125 1660 -210" stroke="#0F6B4F" stroke-width="96" opacity="0.97"/>
