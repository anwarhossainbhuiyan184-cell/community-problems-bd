<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" fill="none" preserveAspectRatio="xMidYMid slice" role="img" aria-label="লাল, সবুজ ও হলুদ রঙের হাতে আঁকা ব্রাশস্ট্রোক">
